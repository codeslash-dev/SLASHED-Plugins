version: 2
updates:
  # Keep admin-app npm dependencies current.
  # Dependabot will open PRs when new versions are available.
  - package-ecosystem: "npm"
    directory: "/SLASHED-for-WP/admin-app"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
