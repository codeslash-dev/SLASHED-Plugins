name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same PR ref so CI only spends minutes on the
# newest commit. Pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate PR commits against Conventional Commits
        run: >-
          npx --no -- commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  build-editor-app:
    name: Build editor-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SLASHED-for-WP/integrations/bricks/editor-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix SLASHED-for-WP/integrations/bricks/editor-app

      - name: Type-check (svelte-check)
        run: npm --prefix SLASHED-for-WP/integrations/bricks/editor-app run check

      - name: Build
        run: npm --prefix SLASHED-for-WP/integrations/bricks/editor-app run build

      # The built editor-app bundle (assets/editor-app/app.js + app.css) is a
      # COMMITTED artifact loaded at runtime. Fail the PR if a source change
      # wasn't rebuilt & committed — otherwise the build here is green while the
      # shipped/committed bundle is stale. (.map files are gitignored, so a
      # clean tree here means the committed app.js/app.css match this build.)
      - name: Fail if committed editor-app bundle is stale
        run: |
          changes="$(git status --porcelain -- SLASHED-for-WP/integrations/bricks/assets/editor-app)"
          if [ -n "$changes" ]; then
            echo "::error::Committed editor-app bundle is out of date. Run 'npm run build:editor-app' and commit the result."
            echo "$changes"
            git --no-pager diff -- SLASHED-for-WP/integrations/bricks/assets/editor-app
            exit 1
          fi

  build-admin-app:
    name: Build admin-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SLASHED-for-WP/admin-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix SLASHED-for-WP/admin-app

      # SLASHED_SKIP_SYNC=1 makes the prebuild/precheck sync hooks no-ops, so
      # CI builds and type-checks the *committed* vendored tree instead of
      # re-vendoring the framework mid-build (which made PR results depend on
      # the framework repo's current state). Drift against the framework is
      # checked by the nightly framework-sync workflow, not per-PR.
      - name: Type-check (svelte-check)
        working-directory: SLASHED-for-WP/admin-app
        env:
          SLASHED_SKIP_SYNC: '1'
        run: npm run check

      - name: Build
        working-directory: SLASHED-for-WP/admin-app
        env:
          SLASHED_SKIP_SYNC: '1'
        run: npm run build

      # The built admin SPA (assets/admin-app/app.js + app.css) is a COMMITTED
      # artifact loaded at runtime by the token page and the frontend overlay.
      # Fail the PR if a source (or vendored-configurator) change wasn't rebuilt
      # & committed — otherwise CI is green while the shipped bundle is stale.
      # (.map files are gitignored, so a clean tree here means the committed
      # app.js/app.css match this build.)
      - name: Fail if committed admin-app bundle is stale
        run: |
          changes="$(git status --porcelain -- SLASHED-for-WP/assets/admin-app)"
          if [ -n "$changes" ]; then
            echo "::error::Committed admin-app bundle is out of date. Run 'npm run build:admin-app' and commit the result."
            echo "$changes"
            git --no-pager diff -- SLASHED-for-WP/assets/admin-app
            exit 1
          fi

  quality:
    name: Lint, test, version & drift checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5  # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install npm dependencies
        run: npm ci

      - name: Install PHP dev dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit tests (editor-app libs + version guard)
        run: npm test

      - name: Verify version metadata is in sync
        run: npm run verify

      # Drift checks (generated hints + vendored admin-app core) need the
      # framework source, so clone it at the ref the plugin is pinned to
      # (SLASHED_CSS_REF in slashed.php). An immutable release tag makes this
      # deterministic — the check can never flip on framework main moving.
      - name: Clone framework at pinned ref
        run: |
          REF=$(grep -oE "define\( *'SLASHED_CSS_REF', *'[^']*'" SLASHED-for-WP/slashed.php | grep -oE "v[0-9][^']*")
          echo "Cloning framework at $REF"
          git clone --depth 1 --branch "$REF" https://github.com/codeslash-dev/SLASHED.git .framework

      - name: Generated artifact & vendoring drift check
        env:
          SLASHED_FRAMEWORK_DIR: .framework
          SLASHED_CONFIGURATOR_SRC: ${{ github.workspace }}/.framework/configurator/src
        run: npm run check

      - name: Lint CSS (stylelint)
        run: npm run lint:css

      - name: Lint PHP syntax (php -l)
        run: npm run lint:php

      - name: PHP unit tests
        run: composer phpunit

      - name: Register PHPCS standards
        run: >-
          vendor/bin/phpcs --config-set installed_paths
          vendor/wp-coding-standards/wpcs,vendor/phpcsstandards/phpcsutils,vendor/phpcsstandards/phpcsextra,vendor/phpcompatibility/php-compatibility,vendor/phpcompatibility/phpcompatibility-paragonie,vendor/phpcompatibility/phpcompatibility-wp

      - name: Lint PHP (PHPCS / WordPress standards)
        run: composer phpcs

      - name: Static analysis (PHPStan)
        run: composer phpstan

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Audit the root toolchain and both bundled Svelte apps. Fail only on
      # high/critical advisories so routine low-severity noise doesn't block.
      - name: Audit root dependencies
        run: npm ci && npm audit --audit-level=high
      - name: Audit editor-app dependencies
        run: |
          npm ci --prefix SLASHED-for-WP/integrations/bricks/editor-app
          npm audit --audit-level=high --prefix SLASHED-for-WP/integrations/bricks/editor-app
      - name: Audit admin-app dependencies
        run: |
          npm ci --prefix SLASHED-for-WP/admin-app
          npm audit --audit-level=high --prefix SLASHED-for-WP/admin-app
