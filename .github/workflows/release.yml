name: Release

# Triggered when a version tag (e.g. v0.1.0) is pushed.
# Stamps the tag version into all plugin files, builds the distributable
# zip, creates a GitHub Release, and uploads slashed.zip as a release asset.

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish WordPress plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp version from tag into plugin files
        run: npm run version-sync -- --from-tag

      - name: Build plugin zip
        run: npm run build:zip

      - name: Create GitHub Release and upload zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --title "SLASHED $TAG" \
            --generate-notes \
            "dist/slashed.zip#slashed.zip"
