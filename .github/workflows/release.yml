name: Release

# Triggered when a version tag (e.g. v0.1.0) is pushed.
# Also triggerable manually to re-attach the zip to an existing release
# (workflow_dispatch lets you retry without deleting and re-pushing the tag).
#
# Syncs the bundled framework CSS to the latest release, stamps the tag
# version into all plugin files, builds the distributable zip, creates
# a GitHub Release (or updates an existing one), and uploads
# slashed.zip as a release asset.

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish WordPress plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          # For workflow_dispatch, check out the specified tag.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # No dependency cache on the release path: a poisoned cache could be
      # baked into the published plugin zip. Fetch fresh from the registry
      # with integrity verification (flagged by zizmor: cache-poisoning).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Sync bundled framework CSS to latest release
        run: npm run update-framework

      - name: Stamp version from tag into plugin files
        run: npm run version-sync -- --from-tag

      - name: Update CHANGELOG and readme.txt for this release
        run: node scripts/changelog-release.js --from-tag

      # Rebuild BOTH bundled Svelte apps so the release ships freshly-built
      # artifacts rather than whatever was last committed. The admin-app build
      # re-vendors the configurator from the framework (needs GITHUB_TOKEN);
      # the editor-app build is self-contained.
      - name: Build editor-app
        run: npm run build:editor-app

      - name: Build admin-app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:admin-app

      - name: Build plugin zip
        run: npm run build:zip

      - name: Commit framework sync + CHANGELOG to default branch
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          DEFAULT_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"

          # Preserve the files updated by update-framework and build:admin-app
          # before we switch branches -- git checkout resets tracked files to
          # the branch state. This must include everything npm run sync (run
          # as build:admin-app's prebuild hook) vendors from the configurator
          # -- admin-app/src/, its manifest, and framework-css/ -- otherwise
          # the configurator changes synced for this release are built into
          # the zip but never committed back to the default branch.
          mkdir -p /tmp/fw-dist /tmp/fw-data /tmp/fw-bricks-data \
            /tmp/fw-admin-app-src /tmp/fw-admin-app-framework-css /tmp/fw-assets-admin-app
          cp -a SLASHED-for-WP/dist/. /tmp/fw-dist/
          cp -a SLASHED-for-WP/data/. /tmp/fw-data/
          cp -a SLASHED-for-WP/integrations/bricks/data/. /tmp/fw-bricks-data/
          cp SLASHED-for-WP/slashed.php /tmp/fw-slashed.php
          cp SLASHED-for-WP/integrations/bricks/slashed-bricks.php /tmp/fw-slashed-bricks.php
          cp SLASHED-for-WP/integrations/gutenberg/slashed-gutenberg.php /tmp/fw-slashed-gutenberg.php
          cp scripts/registry-sources.js /tmp/fw-registry-sources.js
          cp package.json /tmp/fw-package.json
          cp package-lock.json /tmp/fw-package-lock.json
          cp -a SLASHED-for-WP/admin-app/src/. /tmp/fw-admin-app-src/
          cp SLASHED-for-WP/admin-app/.vendored-manifest.json /tmp/fw-admin-app-manifest.json
          cp -a SLASHED-for-WP/admin-app/framework-css/. /tmp/fw-admin-app-framework-css/
          cp -a SLASHED-for-WP/assets/admin-app/. /tmp/fw-assets-admin-app/

          git checkout "$DEFAULT_BRANCH"

          # Restore framework files onto the default branch.
          cp -a /tmp/fw-dist/. SLASHED-for-WP/dist/
          cp -a /tmp/fw-data/. SLASHED-for-WP/data/
          cp -a /tmp/fw-bricks-data/. SLASHED-for-WP/integrations/bricks/data/
          cp /tmp/fw-slashed.php SLASHED-for-WP/slashed.php
          cp /tmp/fw-slashed-bricks.php SLASHED-for-WP/integrations/bricks/slashed-bricks.php
          cp /tmp/fw-slashed-gutenberg.php SLASHED-for-WP/integrations/gutenberg/slashed-gutenberg.php
          cp /tmp/fw-registry-sources.js scripts/registry-sources.js
          cp /tmp/fw-package.json package.json
          cp /tmp/fw-package-lock.json package-lock.json
          rm -rf SLASHED-for-WP/admin-app/src
          mkdir -p SLASHED-for-WP/admin-app/src
          cp -a /tmp/fw-admin-app-src/. SLASHED-for-WP/admin-app/src/
          cp /tmp/fw-admin-app-manifest.json SLASHED-for-WP/admin-app/.vendored-manifest.json
          rm -rf SLASHED-for-WP/admin-app/framework-css SLASHED-for-WP/assets/admin-app
          mkdir -p SLASHED-for-WP/admin-app/framework-css SLASHED-for-WP/assets/admin-app
          cp -a /tmp/fw-admin-app-framework-css/. SLASHED-for-WP/admin-app/framework-css/
          cp -a /tmp/fw-assets-admin-app/. SLASHED-for-WP/assets/admin-app/

          # Re-run changelog-release on the default branch so it picks up the
          # committed tag (the release workflow checks out the tag ref above).
          node scripts/changelog-release.js --from-tag

          git add CHANGELOG.md SLASHED-for-WP/readme.txt \
            SLASHED-for-WP/dist/ \
            SLASHED-for-WP/data/ \
            SLASHED-for-WP/integrations/bricks/data/ \
            SLASHED-for-WP/slashed.php \
            SLASHED-for-WP/integrations/bricks/slashed-bricks.php \
            SLASHED-for-WP/integrations/gutenberg/slashed-gutenberg.php \
            scripts/registry-sources.js \
            package.json \
            package-lock.json \
            SLASHED-for-WP/admin-app/src/ \
            SLASHED-for-WP/admin-app/.vendored-manifest.json \
            SLASHED-for-WP/admin-app/framework-css/ \
            SLASHED-for-WP/assets/admin-app/
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: sync framework + update docs for $TAG"
          git push origin "$DEFAULT_BRANCH"

      - name: Create or update GitHub Release and upload zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Create the release if it doesn't exist yet; no-op if it already does.
          gh release create "$TAG" \
            --title "SLASHED $TAG" \
            --generate-notes || true
          # Upload (or replace) the zip on whatever release exists for this tag.
          gh release upload "$TAG" \
            "dist/slashed.zip#slashed.zip" \
            --clobber
