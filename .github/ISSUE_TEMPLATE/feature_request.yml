name: Feature request
description: Suggest an improvement to the Bricks or Gutenberg integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the plugin makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options:
        - Bricks Builder
        - Gutenberg
        - Both
        - Tooling / build
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
